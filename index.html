<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Techwave</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <header class=" bg-[url(./assets/image.png)] bg-no-repeat bg-cover">

        <nav class=" flex justify-between w-[80%] m-auto text-xl pt-7 items-center pb-7">
            <img src="./assets/TechWave.png" alt="" />
            <div class="flex gap-20 text-white">
                <a>About</a>
                <a>Episodes</a>
                <a>Host</a>
            </div>
            <button
                class="text-white bg-linear-to-tr from-[#F7E93F] via-[#FB09B4] to-[#9100F8] px-4 flex items-center hover:cursor-pointer py-1.5 rounded-4xl">Subscribe
                <span><img src="./assets/ArrowRight.png" alt="" /></span> </button>
        </nav>
        <hr class="text-[#412567]">
        <div class="m-auto w-[350px] mt-24 bg-[url(./assets/hero-circle.png)] bg-no-repeat">
            <img class="m-auto items-center pt-22 pb-25 " src="./assets/microphone.png" alt="" />
        </div>
        <div class="text-center pb-24">
            <h1 class="text-6xl text-white font-bold mt-10">TechWave</h1>
            <p class="text-white mt-2">Your daily dose of tech insights, productivity hacks, and personal growth</p>
            <div class="flex gap-2 mt-5 justify-center ">
                <button
                    class="bg-linear-to-tr from-[#F7E93F] via-[#FB09B4] to-[#9100F8] px-4 py-2 rounded-3xl items-center gap-1 flex"><span><img
                            src="./assets/spotify.png" alt="" /></span> Listen on Spotify</button>
                <button class="text-[#00FF88] border px-4 py-2 rounded-3xl flex items-center gap-1"><span><img
                            src="./assets/message.png" alt="" /></span> Subscribe</button>
            </div>
        </div>
    </header>
    <footer>
        <div class="bg-[url(./assets/footer-bg.png)] bg-cover h-[410px]">
            <img class="m-auto pt-40 " src="./assets/TechWave.png" alt="" />
            <div class="flex gap-10 justify-center pt-14 ">
                <div class="flex text-white items-center gap-2">
                    <img src="./assets/spotify.png" alt="" />
                    <a>Spotify</a>
                </div>
                <div class="flex text-white items-center gap-2">
                    <img src="./assets/apple-podcast.png" alt="" />
                    <a>Apple Podcasts</a>
                </div>
                <div class="flex text-white items-center gap-2">
                    <img src="./assets/youtube-podcast.png" alt="" />
                    <a>YouTube</a>
                </div>
                <div class="flex text-white items-center gap-2">
                    <img src="./assets/twitter.png" alt="" />
                    <a>Twitter</a>
                </div>

            </div>
            <p class="text-white text-center pt-8">© 2026 TechWave Podcast. All rights reserved.</p>
        </div>
    </footer>


</body>

</html>
